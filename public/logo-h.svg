<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 220" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">Casa de Fiestas</title>
  <desc id="logoDesc">Logo elegante con aros dorados, globos salvia y cobre, y el nombre Casa de Fiestas.</desc>
